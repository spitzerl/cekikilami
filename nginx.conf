pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
  access_log /dev/stdout;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=socket_limit:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=50r/s;
  limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Preserve the scheme set by an optional TLS proxy in front of this gateway.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  upstream frontend_upstream {
    server cekikilami-frontend:8080;
  }

  upstream backend_upstream {
    server cekikilami-backend:3001;
  }

  server {
    listen 8080;
    server_name _;

    # Trust Docker's private networks and local reverse proxies for client IPs.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 12m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.dzcdn.net; media-src 'self' https://*.dzcdn.net; font-src 'self'; connect-src 'self' ws: wss:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_conn addr_limit 30;

    location = /health {
      proxy_pass http://backend_upstream/health;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /socket.io/ {
      limit_req zone=socket_limit burst=30 nodelay;
      proxy_pass http://backend_upstream/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_connect_timeout 5s;
    }

    location /uploads/ {
      limit_req zone=upload_limit burst=40 nodelay;
      proxy_pass http://backend_upstream/uploads/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_read_timeout 60s;
      proxy_connect_timeout 5s;
    }

    location /api/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://backend_upstream/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_connect_timeout 5s;
    }

    location / {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_read_timeout 60s;
      proxy_connect_timeout 5s;
    }
  }
}
